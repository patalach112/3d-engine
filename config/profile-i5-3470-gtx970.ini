; ===========================================================================
; Target hardware profile preset: Intel Core i5-3470 + NVIDIA GTX 970
;
; Usage:  3d-engine --config config/profile-i5-3470-gtx970.ini
; (or point ENGINE_CONFIG_PATH at it). Anything not listed here keeps the
; engine defaults. The constants behind these values live in
; src/Core/HardwareProfile.h.
;
; i5-3470: 4 physical cores / 4 threads (no HT), 32 KiB L1d + 256 KiB L2
; per core, 6 MiB L3, DDR3-1600. GTX 970: 4 GiB VRAM (~3.5 GiB fast
; segment), 224 GB/s theoretical bandwidth.
; ===========================================================================

[Window]
width   = 1920
height  = 1080
title   = 3D Engine
resizable = true

[Render]
; Mailbox gives low-latency, tear-free presentation on the GTX 970 by
; replacing queued frames rather than letting input wait behind FIFO.
; Set presentMode = fifo (or presentMode = auto with vsync = true) for
; refresh-locked presentation.
presentMode = mailbox
vsync = false
frustumCulling = true
sortDrawItems = true

; VRAM planning budgets (MiB): stay inside the fast VRAM segment and
; leave the driver/compositor headroom instead of over-committing.
vramBudgetMiB = 3072
stagingBufferBudgetMiB = 256

[Performance]
; 3 workers + the main thread = exactly the 4 physical cores.
; No Hyper-Threading on this part, so a 4th worker would only thrash.
jobWorkerCount = 3

; ~1024 hot ECS items per batch roughly fills one core's 256 KiB L2.
parallelBatchSize = 1024

; Pre-reserve pooled component storage for a mid-size scene.
entityReserve = 4096
parallelMinDrawItems = 128

[Loop]
fixedDeltaSeconds = 0.0166667
maxFixedStepsPerFrame = 5
maxFrameSeconds = 0.25
maxFps = 0
statsLogIntervalSeconds = 5

[Logger]
level = Info
console = true
file = true
asyncFileWrites = true
asyncQueueCapacity = 8192
