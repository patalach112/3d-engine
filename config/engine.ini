; ===========================================================================
; 3D Engine configuration
;
; Every value in this file is optional: anything missing or invalid falls
; back to the engine's built-in defaults and is reported as a warning.
; Lookup order: --config <path> | ENGINE_CONFIG_PATH | ./config/engine.ini
; ===========================================================================

[Window]
; Window size in pixels and title bar text.
width   = 1280
height  = 720
title   = 3D Engine
resizable = true

[Render]
; Presentation mode: auto, fifo, mailbox, immediate, fifo_relaxed.
; An explicit mode overrides vsync. Mailbox is the low-latency default:
; it replaces a queued frame instead of making input wait behind it.
presentMode = mailbox

; Used only when presentMode = auto:
; true = FIFO/vsync, false = IMMEDIATE then MAILBOX.
vsync = false

; View frustum culling: skip entities whose bounds are off-screen.
frustumCulling = true
# Conservative screen-space occlusion culling against static box occluders.
occlusionCulling = false

# Cinematic post-processing (Phase 22): HDR pipeline with bloom,
# ACES filmic tone mapping and sRGB output. exposure multiplies the
# HDR image before tone mapping; bloom picks up luminance above
# bloomThreshold and adds it back at bloomStrength.
exposure = 1.0
bloomEnabled = true
bloomStrength = 0.55
bloomThreshold = 1.0
# Procedural environment: skybox background + image-based lighting.
skyboxEnabled = true
environmentIntensity = 1.0
sortDrawItems = true

; GTX 970 VRAM planning budgets (MiB). The card has 4 GiB with a slower
; top segment; the engine plans device-local allocations against
; 3072 MiB and staging uploads against 256 MiB (see VramBudget).
vramBudgetMiB = 3072
stagingBufferBudgetMiB = 256

; On-screen FPS HUD overlay and its refresh interval (seconds).
hudEnabled = true
hudUpdateIntervalSeconds = 0.25

[Performance]
; JobSystem worker threads (data-parallel systems). 0 = automatic from
; the target hardware profile (i5-3470: 3 workers + main thread = the 4
; physical cores, no oversubscription). Explicit values always win.
jobWorkerCount = 0

; Default parallelFor batch size in items (~1024 hot ECS items roughly
; fill one Ivy Bridge core's 256 KiB L2). 0 = profile heuristic.
parallelBatchSize = 1024

; Component storage reserved up front in the scene's paginated memory
; pool, so building scenes doesn't pay heap-growth costs.
entityReserve = 1024

; Render preparation only dispatches to worker threads at or above this
; many visible meshes; sequential evaluation wins for tiny scenes.
parallelMinDrawItems = 128

[Logger]
; Minimum level: Trace, Debug, Info, Warning, Error, Fatal, Off
level = Debug

; Color-coded console output.
console = true
consoleColor = true

; File output. The directory is created automatically. With
; timestampedFileName = true the active file becomes
; e.g. logs/engine_20261109-120000.log
file = true
filePath = logs/engine.log
appendToFile = false
timestampedFileName = true

; Size-based rotation: rotate at maxFileSizeBytes, keep this many archives
; (0 for either disables rotation / keeps no archives).
maxFileSizeBytes = 5242880
maxRotatedFiles = 3

; Write the log file from a background thread (bounded queue) so disk I/O
; never stalls the game loop.
asyncFileWrites = true
asyncQueueCapacity = 8192

[Loop]
; Fixed simulation step (seconds). 0.0166667 ~= 60 Hz. Deterministic
; simulation/physics will run at exactly this rate.
fixedDeltaSeconds = 0.0166667

; Spiral-of-death protection: never run more than this many fixed steps in
; one frame; any deeper backlog is dropped and counted in the loop stats.
maxFixedStepsPerFrame = 5

; A single frame's delta is clamped to this (seconds) so hitches do not
; teleport the simulation.
maxFrameSeconds = 0.25

; Software FPS cap. 0 = uncapped (vsync may still pace frames).
maxFps = 0

fixedTimestepEnabled = true

; Log frames/FPS/fixed-step statistics at this interval (seconds).
; 0 = only log statistics once at shutdown.
statsLogIntervalSeconds = 5

[Physics]
; Fixed-timestep rigid-body physics (runs in the loop's fixed update).
; demoMode selects the Application sandbox: terrestrial = high-stress
; stacking under directional gravity; space = zero-G orbital scene with a
; localized radial gravity planet, thruster craft, joints, and CCD tests.
demoMode = terrestrial
enabled = true
gravityX = 0
gravityY = -9.81
gravityZ = 0
; Optional global point-mass gravity (0 disables it). gravityCenter is the
; point mass position and gravitySoftening avoids the r=0 singularity.
gravitationalParameter = 0
gravityCenterX = 0
gravityCenterY = 0
gravityCenterZ = 0
gravitySoftening = 0.01
; Swept continuous collision detection for fast bodies.
ccdEnabled = true
linearDamping = 0
angularDamping = 0
; Impacts below this approach speed (m/s) rest instead of bouncing,
; and a contact that persists across sub-steps never re-bounces at
; all; this keeps stacks settled instead of chain-launching.
restitutionVelocityThreshold = 1
; Resting contacts may keep this much penetration (m) uncorrected.
contactSlop = 0.003
; Each positional pass removes only this fraction of the remaining
; penetration, additionally clamped to maxPositionCorrection meters,
; so resting manifolds converge instead of popping apart.
positionCorrection = 0.35
maxPositionCorrection = 0.02
; Resting-contact damping (1/s): bodies resting on persistent
; contacts bleed residual linear/angular energy every sub-step so
; stacks reach absolute rest instead of micro-jittering forever.
contactLinearDamping = 20
contactAngularDamping = 40
solverIterations = 4
; Internal sub-steps per fixed step (fast bodies are collision-sampled
; this many times per step; prevents tunneling and jump glitches).
subSteps = 4
; Non-linear position correction iterations (penetration is re-measured
; after each pass; per-pass correction is strictly clamped).
positionIterations = 2
; Let stationary stacks fall asleep to save CPU (player never sleeps).
; Bodies must stay below both speed thresholds for sleepDelaySeconds;
; only a real impact approach speed wakes a sleeping body again.
sleepEnabled = true
sleepSpeedThreshold = 0.05
sleepAngularThreshold = 3
sleepDelaySeconds = 0.5
wakeSpeedThreshold = 0.2
; Physics batches use the JobSystem at or above this many bodies.
parallelMinBodies = 128

[Input]
; Grab and hide the cursor at startup for first-person mouse look.
; Afterwards: click the window to capture the mouse, Esc releases it
; (a second Esc quits).
captureMouseOnStart = true
captureMouseOnClick = true

[Camera]
; First-person camera start position and orientation (degrees).
; Yaw -90 looks down -Z, i.e. from (0, 0, 3) straight at the cube.
positionX = 0
positionY = 0
positionZ = 3
yawDegrees = -90
pitchDegrees = 0

; Movement in world units per second; Shift multiplies by boostMultiplier.
movementSpeed = 3
boostMultiplier = 2.5

; Mouse look: degrees per pixel of cursor movement.
mouseSensitivity = 0.1
invertY = false

; Exponential smoothing time constants (seconds). The response is based
; on elapsed time, so it feels the same at any frame rate. 0 disables it.
lookSmoothingSeconds = 0.01
movementSmoothingSeconds = 0.03

; Pitch is clamped to +/- this many degrees (< 90 prevents gimbal lock).
pitchLimitDegrees = 89

fieldOfViewDegrees = 45
nearPlane = 0.1
farPlane = 100

[Game]
# Native game module (Phases 23-24): path to the compiled game
# library. Modules ship under engine-branded names
# (EngineRuntimeCore_<signature>.dll/.so) and must pass the
# GetEngineModuleInfo handshake (ABI token + version); anything else
# is rejected. Empty = no module. With moduleHotReload = true the
# engine polls the file and hot-swaps new builds (via a scratch
# copy, so rebuilds never lock).
# Try the Phase 24 Newtonian space-flight sandbox (run from the
# build directory): modulePath = EngineRuntimeCore_31ba0de483.so
modulePath =
moduleHotReload = true
